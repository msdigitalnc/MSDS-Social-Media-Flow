<!doctype html><html><head><meta charset="utf-8"><style>
:root{--brand:#2D2B8F;--deep:#1E1C6E;--tint:#EEEEF7;--white:#FFFFFF}
body{margin:0;background:var(--tint);font-family:Arial,Helvetica,sans-serif;color:var(--white)}
.art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand) 0%,var(--deep) 100%);box-sizing:border-box;padding:7%;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-size:2.6cqw;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
h1{margin:0;font-size:6.2cqw;line-height:1.12;font-weight:700;text-wrap:balance}
p{margin:3cqw 0 0;font-size:3.2cqw;line-height:1.35;opacity:.95}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:2.2cqw;opacity:.85}
.logo{width:13cqw;height:auto}
.art{container-type:inline-size}
</style></head><body><div class="art" style="width:1080px;height:1080px">
  <div><div class="eyebrow">Website roles</div>
  <h1>Support, Training &amp; HR: the people side</h1>
  <p>Staff know how to update content, handle requests, and answer questions around the clock.</p></div>
  <div class="foot"><span>msdigitalsolutions.com</span><img class="logo" src="msds-logo.png" alt="MS Digital Solutions"></div>
</div></body></html>
