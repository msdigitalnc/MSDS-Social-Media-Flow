<title>Ask a Website Expert Landscape</title>
<style>
:root{--brand:#2D2B8F;--deep:#1E1C6E;--tint:#EEEEF7;--white:#FFFFFF;color-scheme:light}
body{background:var(--tint);font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--deep)}
.art{position:relative;width:100%;max-width:1200px;margin:0 auto;aspect-ratio:1200/900;container-type:inline-size;overflow:hidden;background:var(--white);color:var(--deep)}
.stripe{position:absolute;left:0;right:0;top:0;height:2.2cqw;background:var(--white)}
.header{position:absolute;left:0;right:0;top:2.2cqw;height:15cqw;background:var(--deep);color:var(--white);display:flex;align-items:center;padding:0 8cqw}
.eyebrow{font-size:4.6cqw;letter-spacing:.08em;text-transform:uppercase;font-weight:700;line-height:1.1}
.copy{position:absolute;left:8cqw;right:8cqw;top:22cqw}
h1{font-size:6.6cqw;line-height:1.1;font-weight:700;text-wrap:balance;max-width:82%}
.ask{position:absolute;left:8cqw;bottom:14cqw;font-size:2.8cqw;font-weight:600}
.base{position:absolute;left:0;right:0;bottom:0;height:2.2cqw;background:var(--brand)}
.logo{position:absolute;right:8cqw;bottom:8cqw;width:12.6cqw;height:auto}
</style>
<div class="art" role="img" aria-label="Ask a Website Expert. Do I still need a website if I have a Google Business Profile?">
  <div class="stripe"></div>
  <div class="header"><div class="eyebrow">Ask a Website Expert</div></div>
  <div class="copy">
    <h1>Do I still need a website if I have a Google Business Profile?</h1>
  </div>
  <div class="ask">Send us your questions.</div>
  <div class="base"></div>
  <img class="logo" src="msds-logo.png" alt="MS Digital Solutions">
</div>
